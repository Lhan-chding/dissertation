[build-system]
requires = ["setuptools==84.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "compbias"
version = "0.1.0"
description = "Auditable experiments for compensability bias in multimodal outcome reinforcement learning"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "CompBias contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
  "Pillow>=12.3.0,<13",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
neural = ["torch>=2.3,<3"]
gpu-pilot = [
  "accelerate==1.14.0",
  "datasets==5.0.0",
  "peft==0.19.1",
  "qwen-vl-utils==0.0.14",
  "transformers==5.14.1",
  "trl==1.9.0",
]
dev = [
  "compbias[neural]",
  "coverage[toml]>=7.5,<8",
  "hypothesis>=6.100,<7",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "slow: deterministic CPU experiment that may take more than one second",
  "neural: small CPU neural-model test",
]

[tool.coverage.run]
branch = true
source = ["compbias", "scripts"]
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
