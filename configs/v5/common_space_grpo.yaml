authorization:
  inference_allowed: true
  training_allowed: true
  rl_allowed: true
  downloads_allowed: false
offline:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
